<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stratos Janitor</title>
<style>
  :root {
    --mint: #7FFFB0;
    --mint-strong: #5BFF9A;
    --mint-soft: rgba(127, 255, 176, 0.14);
    --mint-glow: rgba(127, 255, 176, 0.32);
    --mint-ink: #062B14;
    --gold: #CDB06A;
    --bg-page: #050709;
    --bg-stage: #0B0F12;
    --bg-card: #11171B;
    --fg: #F2F5F4;
    --fg-soft: rgba(242, 245, 244, 0.72);
    --fg-mute: rgba(242, 245, 244, 0.48);
    --line-strong: rgba(255, 255, 255, 0.16);
  }
  @font-face {
    font-family: 'Geist';
    src: local('Geist'), local('Inter');
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    background: var(--bg-page);
    color: var(--fg);
    font-family: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    padding: 72px 96px;
    background:
      radial-gradient(900px 500px at 85% 110%, rgba(127, 255, 176, 0.18), transparent 60%),
      radial-gradient(700px 400px at 10% -10%, rgba(205, 176, 106, 0.10), transparent 60%),
      linear-gradient(180deg, #06090B 0%, #050709 100%);
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "title  logo"
      "footer footer";
    column-gap: 64px;
    row-gap: 32px;
  }
  .grid-noise {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(127,255,176,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,255,176,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }
  .header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 2;
  }
  .header .brand-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 16px var(--mint-glow);
  }
  .header .brand-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-soft);
  }
  .title {
    grid-area: title;
    align-self: end;
    position: relative;
    z-index: 2;
  }
  .title .eyebrow {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 16px;
    opacity: 0.85;
  }
  .title h1 {
    font-size: 96px;
    line-height: 1.0;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--fg);
    margin-bottom: 24px;
  }
  .title h1 .grad {
    background: linear-gradient(135deg, var(--mint) 0%, var(--mint-strong) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title .tag {
    font-size: 26px;
    color: var(--fg-soft);
    max-width: 720px;
    line-height: 1.35;
  }
  .logo {
    grid-area: logo;
    align-self: center;
    justify-self: end;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .logo .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(127, 255, 176, 0.22), transparent 70%);
    filter: blur(8px);
  }
  .logo svg {
    width: 230px;
    height: 230px;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 40px rgba(127, 255, 176, 0.35));
  }
  .footer {
    grid-area: footer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line-strong);
    padding-top: 28px;
    position: relative;
    z-index: 2;
  }
  .footer .chips {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 16px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    color: var(--fg-soft);
    background: rgba(255,255,255,0.02);
    letter-spacing: 0.02em;
  }
  .chip.accent {
    border-color: rgba(127,255,176,0.35);
    color: var(--mint);
    background: var(--mint-soft);
  }
  .footer .by {
    font-size: 18px;
    color: var(--fg-mute);
    letter-spacing: 0.04em;
  }
  .footer .by strong {
    color: var(--fg-soft);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-noise"></div>

  <div class="header">
    <div class="brand-dot"></div>
    <div class="brand-name">Stratos House AI</div>
  </div>

  <div class="title">
    <div class="eyebrow">Free for Claude Code</div>
    <h1>Stratos<br/><span class="grad">Janitor</span></h1>
    <div class="tag">Cleans up your computer and your Claude Code working directory. Diagnoses, asks permission, then fixes it. Reversible.</div>
  </div>

  <div class="logo">
    <div class="ring"></div>
    <!-- Broom mark — gold handle, mint bristles, matching the Stratos accent palette -->
    <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E4CE92"/>
          <stop offset="0.55" stop-color="#CDB06A"/>
          <stop offset="1" stop-color="#9E823F"/>
        </linearGradient>
        <linearGradient id="bristle" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#9DFFC4"/>
          <stop offset="0.5" stop-color="#5BFF9A"/>
          <stop offset="1" stop-color="#2FBE6E"/>
        </linearGradient>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F0E6C2"/>
          <stop offset="1" stop-color="#B89A57"/>
        </linearGradient>
      </defs>

      <g transform="rotate(20 120 120)">
        <!-- handle -->
        <rect x="111" y="16" width="18" height="120" rx="9" fill="url(#wood)"/>
        <!-- subtle handle highlight -->
        <rect x="115" y="22" width="4" height="106" rx="2" fill="#FFFFFF" opacity="0.18"/>

        <!-- binding band -->
        <rect x="98" y="128" width="44" height="21" rx="7" fill="url(#band)"/>
        <rect x="98" y="135" width="44" height="3" fill="#7A6532" opacity="0.4"/>

        <!-- bristle head: fuller fan with soft tips -->
        <path d="M99 149 H141 L176 210 Q172 220 162 220 Q120 232 78 220 Q68 220 64 210 Z" fill="url(#bristle)"/>
        <!-- bristle separations -->
        <g stroke="#0B3F23" stroke-width="2.6" opacity="0.42" stroke-linecap="round">
          <line x1="120" y1="155" x2="120" y2="224"/>
          <line x1="108" y1="155" x2="98"  y2="223"/>
          <line x1="96"  y1="154" x2="78"  y2="219"/>
          <line x1="132" y1="155" x2="142" y2="223"/>
          <line x1="144" y1="154" x2="162" y2="219"/>
        </g>
        <!-- inner sheen on bristles -->
        <path d="M99 149 H141 L154 180 Q120 189 86 180 Z" fill="#FFFFFF" opacity="0.13"/>
      </g>
    </svg>
  </div>

  <div class="footer">
    <div class="chips">
      <span class="chip accent">janitor-device</span>
      <span class="chip">janitor-claude</span>
      <span class="chip">macOS</span>
      <span class="chip">Windows</span>
      <span class="chip">Reversible</span>
      <span class="chip">No telemetry</span>
    </div>
    <div class="by">by <strong>stratosagency.ai</strong></div>
  </div>
</div>
</body>
</html>
